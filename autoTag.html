<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>自动标签生成器</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
				background-color: #f5f5f5;
				color: #333;
				line-height: 1.6;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
				padding: 20px;
			}

			.grid {
				display: flex;
				gap: 30px;
				height: calc(100vh - 40px);
			}

			.preview-card {
				position: sticky;
				top: 20px;
				width: 400px;
				flex-shrink: 0;
				height: calc(100vh - 40px);
				overflow-y: auto;
			}

			.config-card {
				flex: 1;
				min-width: 0;
				height: calc(100vh - 40px);
			}

			.card-content {
				height: 100%;
				overflow-y: auto;
				padding: 24px;
			}

			@media (max-width: 1200px) {
				.grid {
					flex-direction: column;
					height: auto;
				}

				.preview-card {
					position: static;
					width: 100%;
					height: auto;
					order: 2;
				}

				.config-card {
					order: 1;
					height: auto;
				}
			}

			.card {
				background: white;
				border-radius: 12px;
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
				overflow: hidden;
			}

			.card-title {
				font-size: 1.25rem;
				font-weight: 600;
				color: #1f2937;
				margin-bottom: 20px;
				display: flex;
				align-items: center;
				gap: 8px;
			}

			.card-title-icon {
				width: 8px;
				height: 8px;
				background: linear-gradient(45deg, #3b82f6, #8b5cf6);
				border-radius: 50%;
			}

			.form-group {
				margin-bottom: 16px;
			}

			.form-label {
				display: block;
				font-size: 14px;
				font-weight: 500;
				color: #374151;
				margin-bottom: 6px;
			}

			.form-input,
			.form-select {
				width: 100%;
				padding: 8px 12px;
				border: 1px solid #d1d5db;
				border-radius: 6px;
				font-size: 14px;
				transition: border-color 0.2s;
			}

			.form-input:focus,
			.form-select:focus {
				outline: none;
				border-color: #3b82f6;
				box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
			}

			.form-divider {
				border: none;
				height: 1px;
				background: #e5e7eb;
				margin: 20px 0;
			}

			.grid-cols-2 {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 12px;
			}

			.space-y-4 > * + * {
				margin-top: 16px;
			}

			.space-y-2 > * + * {
				margin-top: 8px;
			}

			.text-sm {
				font-size: 14px;
			}

			.font-medium {
				font-weight: 500;
			}

			.text-gray-700 {
				color: #374151;
			}

			.color-input {
				width: 40px;
				height: 32px;
				border: 1px solid #d1d5db;
				border-radius: 6px;
				cursor: pointer;
			}

			.input-with-unit {
				display: flex;
				align-items: center;
			}

			.input-with-unit input {
				flex: 1;
				border-top-right-radius: 0;
				border-bottom-right-radius: 0;
			}

			.input-unit {
				padding: 8px 12px;
				background: #f9fafb;
				border: 1px solid #d1d5db;
				border-left: none;
				border-top-right-radius: 6px;
				border-bottom-right-radius: 6px;
				font-size: 14px;
				color: #6b7280;
			}

			.preview-area {
				background: #f9fafb;
				border: 2px dashed #d1d5db;
				border-radius: 12px;
				padding: 40px 20px;
				text-align: center;
				margin-bottom: 20px;
			}

			.preview-content {
				margin-bottom: 30px;
			}

			.preview-title {
				font-size: 1.1rem;
				font-weight: 600;
				color: #374151;
				margin-bottom: 8px;
			}

			.preview-subtitle {
				font-size: 14px;
				color: #6b7280;
				margin-bottom: 30px;
			}

			.tag-preview {
				display: flex;
				justify-content: center;
				align-items: center;
				margin: 40px 0;
				min-height: 80px;
			}

			.tag-preview #tagContent {
				display: inline-block;
			}

			.preview-tag {
				display: flex;
				justify-content: center;
				align-items: center;
				width: 100%;
			}

			.download-btn {
				width: 100%;
				padding: 12px 24px;
				background: linear-gradient(45deg, #3b82f6, #8b5cf6);
				color: white;
				border: none;
				border-radius: 8px;
				font-size: 16px;
				font-weight: 500;
				cursor: pointer;
				transition: transform 0.2s, box-shadow 0.2s;
			}

			.download-btn:hover {
				transform: translateY(-1px);
				box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
			}

			.section-title {
				font-size: 16px;
				font-weight: 600;
				color: #1f2937;
				margin: 20px 0 12px 0;
				padding-bottom: 8px;
				border-bottom: 1px solid #e5e7eb;
			}

			.hidden {
				display: none;
			}

			.flex {
				display: flex;
			}

			.items-center {
				align-items: center;
			}

			.gap-2 {
				gap: 8px;
			}

			.w-16 {
				width: 64px;
			}

			.mb-2 {
				margin-bottom: 8px;
			}

			.w-full {
				width: 100%;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="grid">
				<!-- 配置面板 -->
				<div class="card config-card">
					<div class="card-content">
						<h2 class="card-title">
							<div class="card-title-icon"></div>
							标签配置
						</h2>

						<form id="configForm">
							<div class="form-group">
								<label class="form-label">文字内容</label>
								<input type="text" class="form-input" id="text" value="示例标签" placeholder="请输入标签文字" />
							</div>

							<hr class="form-divider" />

							<div class="form-group">
								<label class="form-label">背景类型</label>
								<select class="form-select" id="backgroundType">
									<option value="solid">纯色</option>
									<option value="gradient" selected>渐变</option>
								</select>
							</div>

							<!-- 纯色背景配置 -->
							<div id="solidConfig" class="hidden">
								<div class="form-group">
									<label class="form-label">背景颜色</label>
									<input type="color" class="color-input" id="backgroundColor" value="#3b82f6" />
								</div>
								<div class="form-group">
									<label class="form-label">透明度</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="backgroundOpacity" value="10" min="0" max="100" />
										<span class="input-unit">%</span>
									</div>
								</div>
							</div>

							<!-- 渐变背景配置 -->
							<div id="gradientConfig" class="space-y-4">
								<div class="form-group">
									<label class="form-label">渐变方向</label>
									<select class="form-select" id="gradientDirection">
										<option value="to right" selected>从左到右</option>
										<option value="to left">从右到左</option>
										<option value="to bottom">从上到下</option>
										<option value="to top">从下到上</option>
										<option value="to bottom right">从左上到右下</option>
										<option value="to bottom left">从右上到左下</option>
										<option value="to top right">从左下到右上</option>
										<option value="to top left">从右下到左上</option>
										<option value="radial">径向渐变</option>
									</select>
								</div>

								<!-- 径向渐变中心位置 -->
								<div id="radialConfig" class="hidden space-y-4">
									<div class="text-sm font-medium text-gray-700">渐变中心位置</div>
									<div class="grid-cols-2">
										<div class="form-group">
											<label class="form-label">水平位置</label>
											<div class="input-with-unit">
												<input type="number" class="form-input" id="gradientCenterX" value="50" min="0" max="100" />
												<span class="input-unit">%</span>
											</div>
										</div>
										<div class="form-group">
											<label class="form-label">垂直位置</label>
											<div class="input-with-unit">
												<input type="number" class="form-input" id="gradientCenterY" value="50" min="0" max="100" />
												<span class="input-unit">%</span>
											</div>
										</div>
									</div>
								</div>

								<div class="grid-cols-2">
									<div class="space-y-2">
										<div class="form-group">
											<label class="form-label">起始颜色</label>
											<input type="color" class="color-input" id="gradientStartColor" value="#8b5cf6" />
										</div>
										<div class="form-group">
											<label class="form-label">起始透明度</label>
											<div class="input-with-unit">
												<input
													type="number"
													class="form-input"
													id="gradientStartOpacity"
													value="10"
													min="0"
													max="100"
												/>
												<span class="input-unit">%</span>
											</div>
										</div>
									</div>
									<div class="space-y-2">
										<div class="form-group">
											<label class="form-label">结束颜色</label>
											<input type="color" class="color-input" id="gradientEndColor" value="#ef4444" />
										</div>
										<div class="form-group">
											<label class="form-label">结束透明度</label>
											<div class="input-with-unit">
												<input type="number" class="form-input" id="gradientEndOpacity" value="10" min="0" max="100" />
												<span class="input-unit">%</span>
											</div>
										</div>
									</div>
								</div>
							</div>

							<div class="form-group">
								<label class="form-label">文字颜色</label>
								<input type="color" class="color-input" id="textColor" value="#ffffff" />
							</div>

							<div class="section-title">文字设置</div>
							<div class="grid-cols-2">
								<div class="form-group">
									<label class="form-label">字体大小</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="fontSize" value="20" min="8" max="100" />
										<span class="input-unit">px</span>
									</div>
								</div>
								<div class="form-group">
									<label class="form-label">字体粗细</label>
									<select class="form-select" id="fontWeight">
										<option value="100">极细 (100)</option>
										<option value="200">细 (200)</option>
										<option value="300">轻 (300)</option>
										<option value="400" selected>正常 (400)</option>
										<option value="500">中等 (500)</option>
										<option value="600">半粗 (600)</option>
										<option value="700">粗 (700)</option>
										<option value="800">特粗 (800)</option>
										<option value="900">极粗 (900)</option>
									</select>
								</div>
							</div>

							<div class="space-y-4">
								<div class="text-sm font-medium text-gray-700">阴影效果</div>
								<div class="grid-cols-2">
									<div class="form-group">
										<label class="form-label">水平偏移</label>
										<div class="input-with-unit">
											<input type="number" class="form-input" id="textShadowOffsetX" value="2" min="-20" max="20" />
											<span class="input-unit">px</span>
										</div>
									</div>
									<div class="form-group">
										<label class="form-label">垂直偏移</label>
										<div class="input-with-unit">
											<input type="number" class="form-input" id="textShadowOffsetY" value="2" min="-20" max="20" />
											<span class="input-unit">px</span>
										</div>
									</div>
									<div class="form-group">
										<label class="form-label">模糊半径</label>
										<div class="input-with-unit">
											<input type="number" class="form-input" id="textShadowBlur" value="4" min="0" max="20" />
											<span class="input-unit">px</span>
										</div>
									</div>
									<div class="form-group">
										<label class="form-label">阴影颜色</label>
										<input type="color" class="color-input" id="textShadowColor" value="#000000" />
									</div>
								</div>
							</div>

							<div class="section-title">边距设置</div>
							<div class="grid-cols-2">
								<div class="form-group">
									<label class="form-label">上边距</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="paddingTop" value="8" min="0" max="50" />
										<span class="input-unit">px</span>
									</div>
								</div>
								<div class="form-group">
									<label class="form-label">下边距</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="paddingBottom" value="8" min="0" max="50" />
										<span class="input-unit">px</span>
									</div>
								</div>
								<div class="form-group">
									<label class="form-label">左边距</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="paddingLeft" value="16" min="0" max="50" />
										<span class="input-unit">px</span>
									</div>
								</div>
								<div class="form-group">
									<label class="form-label">右边距</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="paddingRight" value="16" min="0" max="50" />
										<span class="input-unit">px</span>
									</div>
								</div>
							</div>

							<div class="section-title">圆角和边框</div>
							<div class="space-y-4">
								<div class="flex items-center gap-2 mb-2">
									<span class="text-sm font-medium text-gray-700">圆角设置</span>
									<select class="form-select w-16" id="borderRadiusUnit">
										<option value="px" selected>px</option>
										<option value="%">%</option>
									</select>
								</div>
								<div class="grid-cols-2">
									<div class="form-group">
										<label class="form-label">左上</label>
										<input type="number" class="form-input" id="borderRadiusTopLeft" value="50" min="0" max="50" />
									</div>
									<div class="form-group">
										<label class="form-label">右上</label>
										<input type="number" class="form-input" id="borderRadiusTopRight" value="50" min="0" max="50" />
									</div>
									<div class="form-group">
										<label class="form-label">左下</label>
										<input type="number" class="form-input" id="borderRadiusBottomLeft" value="50" min="0" max="50" />
									</div>
									<div class="form-group">
										<label class="form-label">右下</label>
										<input type="number" class="form-input" id="borderRadiusBottomRight" value="50" min="0" max="50" />
									</div>
								</div>
								<div class="form-group">
									<label class="form-label">边框宽度</label>
									<div class="input-with-unit">
										<input type="number" class="form-input" id="borderWidth" value="1" min="0" max="10" />
										<span class="input-unit">px</span>
									</div>
								</div>
							</div>

							<div id="borderConfig">
								<div class="grid-cols-2">
									<div class="form-group">
										<label class="form-label">边框颜色</label>
										<input type="color" class="color-input" id="borderColor" value="#ffffff" />
									</div>
									<div class="form-group">
										<label class="form-label">边框样式</label>
										<select class="form-select" id="borderStyle">
											<option value="solid" selected>实线</option>
											<option value="dashed">虚线</option>
											<option value="dotted">点线</option>
										</select>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>

				<!-- 预览面板 -->
				<div class="card preview-card">
					<div class="card-content">
						<h2 class="card-title">
							<div class="card-title-icon"></div>
							实时预览
						</h2>

						<div class="preview-area">
							<div class="preview-content">
								<h3 class="preview-title">标签预览</h3>
								<p class="preview-subtitle">在这里查看你的标签效果</p>
								<div class="preview-tag">
									<div id="tagPreview" class="tag-preview">
										<div id="tagContent">示例标签</div>
									</div>
								</div>
							</div>
						</div>

						<button class="download-btn" onclick="downloadTag()">📥 下载PNG图片</button>
					</div>
				</div>
			</div>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
		<script>
			// 配置对象
			let config = {
				backgroundColor: '#3b82f6',
				backgroundOpacity: 10,
				backgroundType: 'gradient',
				gradientDirection: 'to right',
				gradientStartColor: '#8b5cf6',
				gradientStartOpacity: 10,
				gradientEndColor: '#ef4444',
				gradientEndOpacity: 10,
				gradientCenterX: 50,
				gradientCenterY: 50,
				text: '示例标签',
				textColor: '#ffffff',
				fontSize: 20,
				fontWeight: 400,
				textShadowOffsetX: 2,
				textShadowOffsetY: 2,
				textShadowBlur: 4,
				textShadowColor: '#000000',
				paddingTop: 8,
				paddingBottom: 8,
				paddingLeft: 16,
				paddingRight: 16,
				borderRadiusTopLeft: 50,
				borderRadiusTopRight: 50,
				borderRadiusBottomLeft: 50,
				borderRadiusBottomRight: 50,
				borderRadiusUnit: 'px',
				borderWidth: 1,
				borderColor: '#ffffff',
				borderStyle: 'solid'
			};

			// 从本地存储加载配置
			function loadConfigFromStorage() {
				try {
					const saved = localStorage.getItem('tagConfig');
					if (saved) {
						config = { ...config, ...JSON.parse(saved) };
					}
				} catch (error) {
					console.warn('Failed to load config from localStorage:', error);
				}
			}

			// 保存配置到本地存储
			function saveConfigToStorage() {
				try {
					localStorage.setItem('tagConfig', JSON.stringify(config));
				} catch (error) {
					console.warn('Failed to save config to localStorage:', error);
				}
			}

			// 颜色转换函数
			function hexToRgba(hex, opacity) {
				const r = parseInt(hex.slice(1, 3), 16);
				const g = parseInt(hex.slice(3, 5), 16);
				const b = parseInt(hex.slice(5, 7), 16);
				return `rgba(${r}, ${g}, ${b}, ${opacity / 100})`;
			}

			// 获取背景样式
			function getBackgroundStyle() {
				if (config.backgroundType === 'gradient') {
					const startColor = hexToRgba(config.gradientStartColor, config.gradientStartOpacity);
					const endColor = hexToRgba(config.gradientEndColor, config.gradientEndOpacity);
					if (config.gradientDirection === 'radial') {
						return `radial-gradient(circle at ${config.gradientCenterX}% ${config.gradientCenterY}%, ${startColor}, ${endColor})`;
					}
					return `linear-gradient(${config.gradientDirection}, ${startColor}, ${endColor})`;
				}
				return hexToRgba(config.backgroundColor, config.backgroundOpacity);
			}

			// 更新预览
			function updatePreview() {
				const tagPreview = document.getElementById('tagPreview');
				const tagContent = document.getElementById('tagContent');

				// 更新文字内容
				tagContent.textContent = config.text || '示例标签';

				// 更新标签样式
				const backgroundStyle = getBackgroundStyle();
				const borderRadius = `${config.borderRadiusTopLeft}${config.borderRadiusUnit} ${config.borderRadiusTopRight}${config.borderRadiusUnit} ${config.borderRadiusBottomRight}${config.borderRadiusUnit} ${config.borderRadiusBottomLeft}${config.borderRadiusUnit}`;
				const border =
					config.borderWidth > 0 ? `${config.borderWidth}px ${config.borderStyle} ${config.borderColor}` : 'none';
				const textShadow = `${config.textShadowOffsetX}px ${config.textShadowOffsetY}px ${config.textShadowBlur}px ${config.textShadowColor}`;

				tagPreview.style.cssText = `
                background: ${backgroundStyle};
                padding: ${config.paddingTop}px ${config.paddingRight}px ${config.paddingBottom}px ${config.paddingLeft}px;
                border-radius: ${borderRadius};
                border: ${border};
                display: table-cell;
                text-align: center;
                vertical-align: middle;
                position: relative;
                min-height: 1em;
            `;

				tagContent.style.cssText = `
                color: ${config.textColor};
                font-size: ${config.fontSize}px;
                font-weight: ${config.fontWeight};
                white-space: nowrap;
                line-height: 1;
                display: inline-block;
                text-shadow: ${textShadow};
            `;
			}

			// 更新表单值
			function updateFormValues() {
				Object.keys(config).forEach((key) => {
					const element = document.getElementById(key);
					if (element) {
						element.value = config[key];
					}
				});
			}

			// 切换背景类型显示
			function toggleBackgroundType() {
				const backgroundType = document.getElementById('backgroundType').value;
				const solidConfig = document.getElementById('solidConfig');
				const gradientConfig = document.getElementById('gradientConfig');

				if (backgroundType === 'solid') {
					solidConfig.classList.remove('hidden');
					gradientConfig.classList.add('hidden');
				} else {
					solidConfig.classList.add('hidden');
					gradientConfig.classList.remove('hidden');
				}
			}

			// 切换径向渐变配置显示
			function toggleRadialConfig() {
				const gradientDirection = document.getElementById('gradientDirection').value;
				const radialConfig = document.getElementById('radialConfig');

				if (gradientDirection === 'radial') {
					radialConfig.classList.remove('hidden');
				} else {
					radialConfig.classList.add('hidden');
				}
			}

			// 切换边框配置显示
			function toggleBorderConfig() {
				const borderWidth = parseInt(document.getElementById('borderWidth').value);
				const borderConfig = document.getElementById('borderConfig');

				if (borderWidth > 0) {
					borderConfig.classList.remove('hidden');
				} else {
					borderConfig.classList.add('hidden');
				}
			}

			// 处理表单变化
			function handleFormChange(event) {
				const { id, value } = event.target;

				// 更新配置
				if (id in config) {
					// 数字类型转换
					if (
						[
							'backgroundOpacity',
							'gradientStartOpacity',
							'gradientEndOpacity',
							'fontSize',
							'fontWeight',
							'textShadowOffsetX',
							'textShadowOffsetY',
							'textShadowBlur',
							'paddingTop',
							'paddingBottom',
							'paddingLeft',
							'paddingRight',
							'borderRadiusTopLeft',
							'borderRadiusTopRight',
							'borderRadiusBottomLeft',
							'borderRadiusBottomRight',
							'borderWidth',
							'gradientCenterX',
							'gradientCenterY'
						].includes(id)
					) {
						config[id] = parseInt(value) || 0;
					} else {
						config[id] = value;
					}
				}

				// 特殊处理
				if (id === 'backgroundType') {
					config.backgroundType = value;
					toggleBackgroundType();
				} else if (id === 'gradientDirection') {
					config.gradientDirection = value;
					toggleRadialConfig();
				} else if (id === 'borderWidth') {
					config.borderWidth = parseInt(value) || 0;
					toggleBorderConfig();
				}

				// 保存配置并更新预览
				saveConfigToStorage();
				updatePreview();
			}

			// 下载标签
			async function downloadTag() {
				const tagPreview = document.getElementById('tagPreview');

				try {
					const canvas = await html2canvas(tagPreview, {
						backgroundColor: null,
						scale: 2,
						useCORS: true
					});

					const link = document.createElement('a');
					link.download = `tag-${Date.now()}.png`;
					link.href = canvas.toDataURL('image/png');
					link.click();
				} catch (error) {
					console.error('下载失败:', error);
					alert('下载失败，请重试');
				}
			}

			// 初始化
			function init() {
				// 加载配置
				loadConfigFromStorage();

				// 更新表单值
				updateFormValues();

				// 初始化显示状态
				toggleBackgroundType();
				toggleRadialConfig();
				toggleBorderConfig();

				// 更新预览
				updatePreview();

				// 绑定事件监听器
				const form = document.getElementById('configForm');
				form.addEventListener('input', handleFormChange);
				form.addEventListener('change', handleFormChange);
			}

			// 页面加载完成后初始化
			document.addEventListener('DOMContentLoaded', init);
		</script>
	</body>
</html>

        width: 100%;
        height: 100%;

        background-color: #1e88e5;
        font-family: 'Microsoft YaHei', '微软雅黑', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        touch-action: manipulation;
      }

      #container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }

      #word {
        font-size: 10rem;
        font-weight: bold;
        color: white;
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        padding: 20px;
        border-radius: 15px;
        background-color: rgba(0, 0, 0, 0.2);
        transition:
          transform 0.3s ease,
          background-color 0.3s ease;
        max-width: 90%;
        text-align: center;
      }

      #word.animate {
        transform: scale(1.1);
        background-color: rgba(0, 0, 0, 0.3);
      }

      #hint {
        position: fixed;
        bottom: 20px;
        color: rgba(255, 255, 255, 0.7);
        font-size: 1rem;
        text-align: center;
        width: 100%;

      const container = document.getElementById('container');
      const wordElement = document.getElementById('word');
      const hintElement = document.getElementById('hint');
      let isFirstClick = true;

      // 随机获取词语
      function getRandomWord() {
        const randomIndex = Math.floor(Math.random() * words.length);
        return words[randomIndex];
      }

      // 更新显示的词语
      function updateWord() {
        const randomWord = getRandomWord();
        wordElement.textContent = randomWord;

        // 添加动画效果
        wordElement.classList.add('animate');
        setTimeout(() => {
          wordElement.classList.remove('animate');
        }, 300);

        // 随机更改背景颜色
        const colors = ['#1e88e5', '#43a047', '#e53935', '#8e24aa', '#fb8c00', '#00897b', '#3949ab', '#d81b60', '#6d4c41', '#546e7a'];
        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        document.body.style.backgroundColor = randomColor;
      }

      // 点击事件处理
      container.addEventListener('click', () => {
        if (isFirstClick) {
          isFirstClick = false;
          hintElement.textContent = '点击屏幕切换词语';
        }
        updateWord();
      });

      // 触摸事件处理（移动设备）
      container.addEventListener('touchend', (e) => {
        e.preventDefault(); // 防止双击缩放
        if (isFirstClick) {
          isFirstClick = false;
          hintElement.textContent = '点击屏幕切换词语';
        }
        updateWord();
      });

      // 添加触摸开始事件，防止点击延迟
      container.addEventListener('touchstart', (e) => {
        e.preventDefault(); // 防止默认行为
      });

      // 支持键盘空格键切换
      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space') {
          e.preventDefault(); // 防止页面滚动
          if (isFirstClick) {
            isFirstClick = false;
            hintElement.textContent = '点击屏幕切换词语';
          }
          updateWord();
        }
      });

      // 自动调整字体大小以适应屏幕
      function adjustFontSize() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const minDimension = Math.min(viewportWidth, viewportHeight);
        const isLandscape = viewportWidth > viewportHeight;

        if (isLandscape) {
          // 横屏模式下的字体大小调整
          wordElement.style.fontSize = '8rem';
        } else {
          wordElement.style.fontSize = '5rem';
        }
      }

      // 初始调整和窗口大小变化时调整
      window.addEventListener('resize', adjustFontSize);
      window.addEventListener('orientationchange', () => {
        // 方向改变后稍微延迟调整，确保新尺寸已应用
        setTimeout(adjustFontSize, 300);
      });
      adjustFontSize();

      // 强制横屏提示（如果需要）
      function checkOrientation() {
        if (window.innerHeight > window.innerWidth && window.innerWidth < 900) {
          hintElement.textContent = '请将手机横屏以获得最佳体验';
        } else {
          if (!isFirstClick) {
            hintElement.textContent = '点击屏幕切换词语';
          }
        }
      }

      // 检查初始方向和方向变化
      checkOrientation();
      window.addEventListener('resize', checkOrientation);
      window.addEventListener('orientationchange', () => {
        setTimeout(checkOrientation, 300);
      });

      // 禁用页面缩放
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      });
